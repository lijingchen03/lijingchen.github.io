<h1>在地铁上</h1>

<p>我从干渴中醒来，
托着躯体不想叫醒灵魂
地下通道很长，
1969年就有了北京地铁。

禁止吸烟，
学生们的头油油的，
走在我身前。
此前坐沈阳四号线
灯光一亮显得很干净。
从工业展览馆下车，
就能步行到三好街。
路两旁的叶子闹了一夜
天亮就清洗一切

本次列车终点站是
古城，
向西的终点，
女人穿满服逛北海公园，
男人穿黄袍靠在玉阶前。
出国后大家弄唐装和民国范
热闹非凡 热闹非凡

请注意脚下安全
地铁是一具会移动的棺材，
我们于清晨陪葬，
在摇晃中散落各地。</p>
