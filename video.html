<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>视频创作</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Roboto', Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    font-size: 3em;
    margin-bottom: 40px;
    color: #333;
}

.grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
    justify-items: center;
}

.card {
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    width: 100%;
    max-width: 250px;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
}

.card img {
    width: 100%;
    display: block;
}

.card .title {
    padding: 10px;
    font-weight: bold;
    text-align: center;
    font-size: 1em;
    color: #333;
    background: #fafafa;
}
</style>
</head>
<body>

<h1>视频创作</h1>

<div class="grid-container">
    <a href="video1.html" class="card">
        <img src="cover1.jpg" alt="视频1封面">
        <div class="title">《国之歌》幕后</div>
    </a>
    <a href="video2.html" class="card">
        <img src="cover2.jpg" alt="视频2封面">
        <div class="title">《可能》</div>
    </a>
</div>

<p>
    <a href="index.html">返回首页</a>
</p>

</body>
</html>
