<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>剧本创作</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Libre Baskerville', serif;
    background: linear-gradient(135deg, #fff5e6, #ffe0b3); /* 温暖渐变 */
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
}

.container {
    max-width: 800px;
    width: 100%;
    text-align: center;
}

h1 {
    font-size: 3em;
    color: #6b3f00;
    margin-bottom: 40px;
}

.card {
    background: #fffaf0;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    margin: 20px 0;
    transition: transform 0.3s, box-shadow 0.3s;
    padding: 20px;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
}

.card a {
    text-decoration: none;
    color: #8b4513;
    font-weight: 600;
    font-size: 1.2em;
}

.card a:hover {
    color: #d2691e;
}

.return-home {
    margin-top: 50px;
    text-align: center;
}

.return-home a {
    display: inline-block;
    padding: 8px 25px;
    background: linear-gradient(135deg, #ffb347, #ffcc33);
    color: #fff;
    text-decoration: none;
    border-radius: 25px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
}

.return-home a:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    background: linear-gradient(135deg, #ffcc66, #ffdd99);
}
</style>
</head>
<body>

<div class="container">
    <h1>剧本创作</h1>

    <div class="card">
        <a href="documents/《足下星河》全剧本0805.docx" target="_blank">足下星河</a>
    </div>

    <div class="card">
        <a href="scripts/script2.docx" target="_blank">北京假日</a>
    </div>

    <div class="return-home">
        <a href="index.html">返回首页</a>
    </div>
</div>

</body>
</html>
