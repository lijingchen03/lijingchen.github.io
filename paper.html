<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>论文创作</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Merriweather', serif;
    background: linear-gradient(160deg, #f0f0f0, #e8e2f2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    max-width: 900px;
    width: 90%;
    padding: 40px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    text-align: center;
}

h1 {
    font-size: 3em;
    margin-bottom: 40px;
    color: #333;
    letter-spacing: 1px;
}

.card {
    background: #fff;
    padding: 20px 30px;
    margin: 20px 0;
    border-radius: 15px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    transition: transform 0.3s, box-shadow 0.3s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.1);
}

.card a {
    text-decoration: none;
    color: #333;
    font-size: 1.2em;
    font-weight: 500;
}

.card a:hover {
    color: #6a3fba;
}

.return-home {
    position: fixed;     /* 固定位置 */
    bottom: 20px;        /* 距离底部 20px */
    left: 50%;           /* 水平基准点在中间 */
    transform: translateX(-50%); /* 水平居中 */
    z-index: 100;
    text-align: center;   
}

.return-home a {
    display: inline-block;
    padding: 8px 20px;  
    background: linear-gradient(135deg, #6a3fba, #b07ddb); 
    color: #fff;
    font-size: 0.95em; 
    text-decoration: none;
    border-radius: 25px;     
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
}

.return-home a:hover {
    transform: translateY(-3px); 
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    background: linear-gradient(135deg, #8b5edd, #c9a7f0); 
}

</style>
</head>
<body>

<div class="container">

    </div>

    <div class="card">

    </div>

    <div class="card">

    </div>

    </div>

        <a href="another_paper.html">浅论电影中农村与村民形象的塑造</a>
